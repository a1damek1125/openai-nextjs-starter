# Finalis Portal — local infrastructure (OPTIONAL for the demo).
# The demo runs on SQLite with zero containers:
#   pip install fastapi uvicorn && python3 -m finalis.portal.serve
# This compose file provisions the production-path services for when the
# Postgres/Temporal adapters are wired (see founder-cto-report.md).
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: finalis
      POSTGRES_USER: finalis
      POSTGRES_PASSWORD: finalis-dev
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]

  # Temporal dev server (durable workflows) — future adapter target.
  temporal:
    image: temporalio/auto-setup:latest
    depends_on: [postgres]
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_USER: finalis
      POSTGRES_PWD: finalis-dev
      POSTGRES_SEEDS: postgres
    ports: ["7233:7233"]

volumes:
  pgdata:
